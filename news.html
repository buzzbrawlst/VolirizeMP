<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b">
<title>News | VolirizeMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--white:#f7fbff;--muted:rgba(231,243,255,.72);--line:rgba(220,247,255,.17);--cyan:#a6f6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#03050b;color:var(--white);font-family:"DM Sans",sans-serif;overflow-x:hidden}
#liquid{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#liquid.shader-fallback{background:linear-gradient(145deg,#08e8ed,#087cff 38%,#4825ed 70%,#f02ab6);background-size:180% 180%;animation:flow 14s ease-in-out infinite alternate}@keyframes flow{to{background-position:100% 80%}}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(1,3,12,.45),rgba(1,3,12,.25) 45%,rgba(1,3,12,.72)),radial-gradient(ellipse at 50% 40%,transparent 10%,rgba(1,3,10,.28) 100%)}
.site{position:relative;z-index:2}.nav{height:76px;max-width:1180px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.brand{font-size:14px;font-weight:800;letter-spacing:.08em}.nav a{color:white;text-decoration:none}.nav .back{font-size:12px;color:var(--muted)}
.wrap{max-width:1080px;margin:auto;padding:65px 26px 100px}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--cyan)}
h1{font-size:clamp(43px,7vw,76px);line-height:.98;letter-spacing:-.075em;margin:14px 0 18px}.intro{max-width:610px;color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 38px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.story{display:block;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.045));backdrop-filter:blur(18px);text-decoration:none;color:white;transition:.25s}.story:hover{transform:translateY(-5px);border-color:rgba(166,246,255,.55)}
.cover{height:225px;background:linear-gradient(135deg,#087d9e,#3433a2 60%,#a52d8c);background-size:cover;background-position:center}.content{padding:22px}.meta{font-size:10px;color:var(--cyan);font-weight:800;letter-spacing:.13em;text-transform:uppercase}
h2{font-size:22px;letter-spacing:-.045em;margin:10px 0}.excerpt{font-size:13px;color:var(--muted);line-height:1.75;margin:0 0 18px}.read{font-size:11px;font-weight:800;color:#dffcff}
.article{max-width:790px;margin:auto}.article-cover{height:min(48vw,400px);min-height:210px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#087d9e,#3433a2 60%,#a52d8c);background-size:cover;background-position:center;margin:28px 0}.article-body{white-space:pre-wrap;color:#e0e8f7;font-size:15px;line-height:1.95}.back-link{display:inline-block;margin-bottom:25px;color:var(--cyan);font-size:12px;font-weight:800;text-decoration:none}
.empty{grid-column:1/-1;border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--muted);background:rgba(255,255,255,.06);backdrop-filter:blur(15px)}
.footer{text-align:center;padding:25px;color:rgba(235,245,255,.48);font-size:10px;letter-spacing:.08em}
@media(max-width:700px){.nav{height:68px;padding:0 19px}.wrap{padding:48px 19px 75px}.grid{grid-template-columns:1fr}.cover{height:190px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><canvas id="liquid" aria-hidden="true"></canvas><div class="shade"></div><div class="site">
<header class="nav"><a class="brand" href="home.html">VOLIRIZEMP</a><a class="back" href="home.html">← Back to home</a></header>
<main class="wrap">
<section id="listing"><div class="kicker">Project updates</div><h1>News & updates.</h1><p class="intro">Announcements, development notes and updates from the VolirizeMP project.</p><div class="grid" id="stories"><div class="empty">Loading updates…</div></div></section>
<article class="article" id="article" hidden><a class="back-link" href="news.html">← All news</a><div class="kicker" id="article-date">VOLIRIZEMP NEWS</div><h1 id="article-title"></h1><p class="intro" id="article-excerpt"></p><div class="article-cover" id="article-cover"></div><div class="article-body" id="article-body"></div></article>
</main><footer class="footer">VOLIRIZEMP © 2026 · COMMUNITY PROJECT</footer></div>
<script>
const $=id=>document.getElementById(id);
const formatDate=value=>{if(!value)return "PROJECT UPDATE";const d=new Date(value+"T00:00:00");return Number.isNaN(d.getTime())?value:d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});};
const safeImage=value=>typeof value==="string"&&value.trim()?value.trim():"";
const params=new URLSearchParams(location.search),slug=params.get("story");
function showArticle(post){
 $("listing").hidden=true;$("article").hidden=false;
 if(!post){$("article-title").textContent="Story not found";$("article-excerpt").textContent="This update may have been removed."; $("article-cover").hidden=true;return;}
 $("article-date").textContent=formatDate(post.date)+(post.category?" · "+post.category:"");
 $("article-title").textContent=post.title||"Untitled update";$("article-excerpt").textContent=post.excerpt||"";
 $("article-body").textContent=post.body||"";
 const image=safeImage(post.image);if(image){$("article-cover").style.backgroundImage='url("'+image.replace(/"/g,"%22")+'")';}else $("article-cover").hidden=true;
 document.title=post.title+" | VolirizeMP";
}
function renderStories(items){
 const grid=$("stories");grid.replaceChildren();
 const published=items.filter(p=>p.published!==false).sort((a,b)=>Number(Boolean(b.featured))-Number(Boolean(a.featured))||new Date(b.date||0)-new Date(a.date||0));
 if(slug){showArticle(published.find(p=>p.slug===slug));return;}
 if(!published.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="No updates have been published yet. Check back soon.";grid.append(empty);return;}
 for(const post of published){
  const card=document.createElement("a");card.className="story";card.href="news.html?story="+encodeURIComponent(post.slug||"");
  const cover=document.createElement("div");cover.className="cover";const image=safeImage(post.image);if(image)cover.style.backgroundImage='url("'+image.replace(/"/g,"%22")+'")';
  const content=document.createElement("div");content.className="content";const meta=document.createElement("div");meta.className="meta";meta.textContent=formatDate(post.date)+(post.category?" · "+post.category:"")+(post.featured?" · Featured":"");
  const title=document.createElement("h2");title.textContent=post.title||"Untitled update";const excerpt=document.createElement("p");excerpt.className="excerpt";excerpt.textContent=post.excerpt||"";
  const read=document.createElement("span");read.className="read";read.textContent="Read update ↗";content.append(meta,title,excerpt,read);card.append(cover,content);grid.append(card);
 }
}
fetch("news.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Could not load news.json");return response.json();}).then(data=>renderStories(Array.isArray(data.posts)?data.posts:[])).catch(error=>{console.error(error);if(slug){showArticle(null);return;}$("stories").innerHTML='<div class="empty">News could not be loaded. Please try again later.</div>';});
</script>
<script>
(() => {
  const canvas = document.getElementById('liquid');
  const gl = canvas.getContext('webgl', {alpha:false, antialias:false, powerPreference:'high-performance'});
  if (!gl) { canvas.classList.add('shader-fallback'); return; }
  const vertex = `attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}`;
  const fragment = `precision highp float;
uniform vec2 u_res;
uniform vec2 u_mouse;
uniform float u_time;
uniform float u_active;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),
             mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.0+vec2(13.7,8.3);a*=0.5;}
  return v;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 p=(uv-0.5)*vec2(u_res.x/u_res.y,1.0);
  float t=u_time*0.105;
  vec2 m=(u_mouse-0.5)*vec2(u_res.x/u_res.y,1.0);
  float md=length(p-m);
  float pull=exp(-md*2.4)*u_active;

  // Slow, thick domain movement — broad shapes rather than watery ripples.
  vec2 warp=vec2(
    fbm(p*1.65+vec2(t,-t*0.7)),
    fbm(p*1.65+vec2(-t*0.55,t*0.8))
  );
  vec2 q=p+(warp-0.5)*0.56;
  q+=(p-m)*pull*0.20*sin(t*5.0+md*4.0);

  // Large smooth colour masses overlap like poured, viscous slime.
  float flowA=sin(q.x*2.25+q.y*1.55+t*1.15+warp.x*2.8);
  float flowB=cos(q.y*2.7-q.x*1.2-t*0.8+warp.y*2.6);
  float flowC=sin((q.x+q.y*0.65)*1.7-t*0.55+fbm(q*2.0)*2.4);
  float mass=flowA*0.42+flowB*0.34+flowC*0.24;
  float blobs=smoothstep(-0.42,0.40,mass);
  float inner=smoothstep(0.02,0.62,mass+fbm(q*2.25+t*0.15)*0.18);

  // The palette follows the logo: bright cyan, electric blue, violet and hot pink.
  vec3 cyan=vec3(0.015,0.91,0.98);
  vec3 aqua=vec3(0.16,1.0,0.88);
  vec3 blue=vec3(0.015,0.30,1.0);
  vec3 deepBlue=vec3(0.025,0.10,0.78);
  vec3 violet=vec3(0.34,0.055,0.98);
  vec3 pink=vec3(1.0,0.055,0.66);

  float vertical=uv.y;
  vec3 base=mix(pink,violet,smoothstep(0.02,0.46,vertical));
  base=mix(base,blue,smoothstep(0.36,0.70,vertical));
  base=mix(base,cyan,smoothstep(0.62,0.98,vertical));
  float colourNoise=fbm(q*1.25+vec2(t*0.22,-t*0.18));
  base=mix(base,aqua,smoothstep(0.52,0.92,colourNoise+vertical*0.18)*0.56);

  vec3 slime=mix(deepBlue,blue,smoothstep(-0.55,0.55,mass));
  slime=mix(slime,violet,smoothstep(0.12,0.76,flowC+colourNoise*0.28)*0.76);
  slime=mix(slime,pink,smoothstep(0.52,0.94,fbm(q*1.8+vec2(2.4,-t*0.3)))*0.82);
  slime=mix(slime,cyan,smoothstep(0.20,0.86,flowA-flowB*0.22)*0.72);

  // Broad, soft boundaries give the forms a thick gel / slime appearance.
  vec3 col=mix(base,slime,0.30+0.64*blobs);
  float ridge=1.0-smoothstep(0.015,0.105,abs(mass-0.03));
  col=mix(col,vec3(0.56,0.99,1.0),ridge*0.20);
  float softGlow=smoothstep(0.42,0.96,inner)*0.12;
  col+=vec3(0.10,0.30,0.34)*softGlow;
  col+=vec3(0.0,0.16,0.27)*pull*0.30;

  // Keep the whole canvas luminous; only a gentle edge falloff.
  float vignette=1.0-0.16*smoothstep(0.35,1.15,length((uv-0.5)*vec2(1.0,0.82)));
  col*=vignette;
  col=pow(max(col,vec3(0.0)),vec3(0.88));
  gl_FragColor=vec4(col,1.0);
}`;
  function shader(type, source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('VolirizeMP shader compile failed:',gl.getShaderInfoLog(s));return null;}return s;}
  const vs=shader(gl.VERTEX_SHADER,vertex), fs=shader(gl.FRAGMENT_SHADER,fragment);
  if(!vs||!fs){ canvas.classList.add('shader-fallback'); return; }
  const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){ console.error('VolirizeMP shader link failed:',gl.getProgramInfoLog(program)); canvas.classList.add('shader-fallback'); return; }
  gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const res=gl.getUniformLocation(program,'u_res'),mouse=gl.getUniformLocation(program,'u_mouse'),time=gl.getUniformLocation(program,'u_time'),active=gl.getUniformLocation(program,'u_active');
  let mx=.5,my=.5,target=0,energy=0,start=performance.now();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){const d=Math.min(window.devicePixelRatio||1,1.65);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(res,canvas.width,canvas.height);}
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight;target=1;},{passive:true});
  window.addEventListener('pointerleave',()=>target=0);
  resize();
  function frame(now){energy+=(target-energy)*.035;gl.uniform1f(time,reduced?0:(now-start)/1000);gl.uniform2f(mouse,mx,my);gl.uniform1f(active,energy);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
</body></html>
