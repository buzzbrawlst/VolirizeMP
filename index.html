<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03050b">
<meta name="description" content="VolirizeMP — return to the classic era.">
<title>VolirizeMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--white:#f7fbff;--muted:rgba(231,243,255,.66)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#03050b;color:var(--white);font-family:"DM Sans",sans-serif}
#liquid{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 12%,rgba(1,3,10,.18) 58%,rgba(1,3,10,.78) 100%),linear-gradient(180deg,rgba(0,0,0,.24),transparent 35%,rgba(0,0,0,.28))}
main{position:relative;z-index:2;min-height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:40px 22px}
.hero{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-1.5vh);animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
.logo-wrap{width:clamp(170px,25vw,270px);height:clamp(170px,25vw,270px);display:grid;place-items:center;position:relative;margin-bottom:17px;filter:drop-shadow(0 0 34px rgba(0,213,255,.24)) drop-shadow(0 0 65px rgba(112,54,255,.18))}
.logo-wrap:before{content:"";position:absolute;width:72%;height:35%;bottom:9%;border-radius:50%;background:rgba(24,111,255,.35);filter:blur(42px);opacity:.85}
.logo{width:100%;height:100%;object-fit:contain;position:relative;animation:float 7s ease-in-out infinite}
h1{font-size:clamp(38px,6vw,66px);line-height:1;letter-spacing:-.065em;font-weight:800;margin:0;text-shadow:0 3px 35px rgba(0,0,0,.4)}
.subtitle{font-size:clamp(14px,1.7vw,17px);line-height:1.7;color:var(--muted);font-weight:500;max-width:450px;margin:17px 0 31px;letter-spacing:.005em}
.actions{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap}
.glass-btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:154px;padding:14px 23px;border-radius:13px;border:1px solid rgba(220,247,255,.32);background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(255,255,255,.055));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 35px rgba(0,0,0,.22),0 0 26px rgba(25,190,255,.07);backdrop-filter:blur(22px) saturate(155%);-webkit-backdrop-filter:blur(22px) saturate(155%);color:#fff;text-decoration:none;font:700 13px "DM Sans",sans-serif;letter-spacing:.01em;transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease;overflow:hidden}
.glass-btn:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.23) 48%,transparent 72%);transform:translateX(-120%);transition:transform .65s ease}
.glass-btn:hover{transform:translateY(-3px);border-color:rgba(156,240,255,.7);background:linear-gradient(135deg,rgba(75,221,255,.23),rgba(123,91,255,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 15px 45px rgba(0,0,0,.28),0 0 32px rgba(0,210,255,.18)}
.glass-btn:hover:before{transform:translateX(120%)}
.glass-btn.primary{border-color:rgba(135,236,255,.55);background:linear-gradient(135deg,rgba(28,196,230,.25),rgba(92,88,255,.2));}
.glass-btn svg{width:15px;height:15px;opacity:.95}
.footer-note{position:fixed;z-index:2;bottom:23px;left:0;right:0;text-align:center;color:rgba(224,237,255,.35);font-size:10px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(-1.5vh) scale(1)}}
@media(max-width:520px){main{padding:30px 20px}.logo-wrap{width:210px;height:210px;margin-bottom:14px}.subtitle{max-width:330px;margin:14px 0 25px}.actions{width:100%;gap:10px}.glass-btn{min-width:142px;padding:13px 17px}.footer-note{bottom:15px;font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="liquid" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<main>
  <section class="hero" aria-label="VolirizeMP homepage">
    <div class="logo-wrap"><img class="logo" src="assets/volirize-mark.svg" alt="VolirizeMP V logo"></div>
    <h1>VOLIRIZEMP</h1>
    <p class="subtitle">Your way back to the classic era.</p>
    <div class="actions">
      <a class="glass-btn primary" href="downloads.html">Download <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 18v3h14v-3"/></svg></a>
      <a class="glass-btn" href="news.html">Learn more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    </div>
  </section>
</main>
<div class="footer-note">VOLIRIZEMP · RETURN TO THE CLASSIC ERA</div>
<script>
(() => {
  const canvas = document.getElementById('liquid');
  const gl = canvas.getContext('webgl', {alpha:false, antialias:false, powerPreference:'high-performance'});
  if (!gl) { canvas.style.background='radial-gradient(ellipse at 50% 55%,#064c88 0%,#14236f 30%,#160b3c 56%,#03050b 85%)'; return; }
  const vertex = `attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}`;
  const fragment = `precision highp float;
  uniform vec2 u_res; uniform vec2 u_mouse; uniform float u_time; uniform float u_active;
  #define PI 3.14159265359
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/u_res; vec2 p=(uv-.5)*vec2(u_res.x/u_res.y,1.0);
    float t=u_time*.16;
    vec2 m=(u_mouse-.5)*vec2(u_res.x/u_res.y,1.0);
    float md=length(p-m); float influence=exp(-md*3.0)*u_active;
    vec2 flow=vec2(fbm(p*2.2+vec2(t,-t)),fbm(p*2.2-vec2(t*.8,t)));
    p += (flow-.5)*.42;
    p += normalize(p-m+vec2(.0001))*influence*.17*sin(u_time*1.7);
    float n=fbm(p*2.7+vec2(t*.7,-t*.45));
    float n2=fbm(p*4.2-vec2(t*.4,t*.8));
    float wave=sin(p.x*3.1+p.y*2.0+t*1.5+n*4.0)+cos(p.y*4.0-p.x*1.6-t+n2*3.0);
    float liquid=smoothstep(-.45,.8,wave*.34+n*.65);
    vec3 deep=vec3(.005,.018,.065);
    vec3 blue=vec3(.015,.10,.62);
    vec3 cyan=vec3(.0,.78,.88);
    vec3 aqua=vec3(.12,.95,.88);
    vec3 purple=vec3(.30,.055,.82);
    vec3 pink=vec3(.92,.035,.58);
    float bands=sin((p.x*1.7+p.y*2.1+n*2.5)*3.0-t*2.0);
    vec3 col=mix(deep,blue,smoothstep(.16,.85,liquid));
    col=mix(col,cyan,smoothstep(.48,.83,n2+liquid*.22)*.78);
    col=mix(col,aqua,smoothstep(.70,.98,bands+n*.22)*.5);
    col=mix(col,purple,smoothstep(.50,.95,fbm(p*1.8+vec2(2.4,-t)))*.68);
    col=mix(col,pink,smoothstep(.79,1.0,fbm(p*3.0+vec2(-t,4.1)))*.55);
    float edge=abs(fwidth(liquid)); float sheen=pow(max(0.,1.-abs(fract((n*2.0+wave*.13)*3.0)-.5)*2.),16.);
    col+=vec3(.35,.85,1.)*sheen*.22;
    float vignette=1.-smoothstep(.28,.95,length((uv-.5)*vec2(1.0,.85)));
    col*=.55+.58*vignette;
    col+=vec3(.0,.18,.28)*influence*.55;
    col+=vec3(hash(gl_FragCoord.xy+u_time)-.5)*.012;
    gl_FragColor=vec4(col,1.0);
  }`;
  function shader(type, source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;}
  const vs=shader(gl.VERTEX_SHADER,vertex), fs=shader(gl.FRAGMENT_SHADER,fragment);
  if(!vs||!fs)return;
  const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))return;
  gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const res=gl.getUniformLocation(program,'u_res'),mouse=gl.getUniformLocation(program,'u_mouse'),time=gl.getUniformLocation(program,'u_time'),active=gl.getUniformLocation(program,'u_active');
  let mx=.5,my=.5,target=0,energy=0,start=performance.now();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){const d=Math.min(window.devicePixelRatio||1,1.65);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(res,canvas.width,canvas.height);}
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight;target=1;},{passive:true});
  window.addEventListener('pointerleave',()=>target=0);
  resize();
  function frame(now){energy+=(target-energy)*.035;gl.uniform1f(time,reduced?0:(now-start)/1000);gl.uniform2f(mouse,mx,my);gl.uniform1f(active,energy);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
