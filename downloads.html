<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b">
<title>Downloads | VolirizeMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--white:#f7fbff;--muted:rgba(231,243,255,.72);--line:rgba(220,247,255,.2)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#03050b;color:var(--white);font-family:"DM Sans",sans-serif;overflow-x:hidden}
#liquid{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#liquid.shader-fallback{background:linear-gradient(145deg,#08e8ed,#087cff 38%,#4825ed 70%,#f02ab6);background-size:180% 180%;animation:fallbackFlow 14s ease-in-out infinite alternate}@keyframes fallbackFlow{to{background-position:100% 80%}}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(1,3,12,.42),rgba(1,3,12,.2) 45%,rgba(1,3,12,.65)),radial-gradient(ellipse at 50% 40%,transparent 10%,rgba(1,3,10,.25) 100%)}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px}
.heading{text-align:center;margin-bottom:48px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#a6f6ff}
h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.075em;line-height:1;margin:13px 0 14px;text-shadow:0 8px 35px rgba(0,0,0,.25)}
.subtitle{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
.grid{width:min(100%,900px);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.download{--accent:rgba(165,245,255,.45);position:relative;min-height:220px;padding:27px 20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:17px;color:white;text-decoration:none;border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 18px 55px rgba(0,0,0,.2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow:hidden;transition:transform .25s,border-color .25s,background .25s}
.download:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,var(--accent),transparent 65%);opacity:.32;pointer-events:none}
.download:hover{transform:translateY(-7px);border-color:rgba(183,249,255,.65);background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.075))}
.icon-wrap{position:relative;width:82px;height:82px;display:grid;place-items:center;border-radius:25px;border:1px solid rgba(255,255,255,.32);background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.075));box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 12px 28px rgba(0,0,0,.22);overflow:hidden}
.icon-wrap img{width:100%;height:100%;object-fit:cover}.icon-fallback{font-size:32px;font-weight:800;color:white;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.name{position:relative;font-size:14px;font-weight:800;letter-spacing:-.02em}.description{position:relative;margin-top:-11px;color:var(--muted);font-size:11px;line-height:1.5}
.hint{margin-top:30px;color:rgba(240,248,255,.52);font-size:10px;letter-spacing:.08em;text-align:center}
@media(max-width:520px){main{padding:55px 18px}.heading{margin-bottom:34px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.download{min-height:190px;padding:20px 12px}.icon-wrap{width:70px;height:70px;border-radius:21px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><canvas id="liquid" aria-hidden="true"></canvas><div class="shade" aria-hidden="true"></div>
<main><header class="heading"><div class="eyebrow">VOLIRIZEMP</div><h1>Downloads.</h1><p class="subtitle">Everything you need, all in one place.</p></header>
<section class="grid" id="downloads" aria-label="Available downloads"><p class="subtitle">Loading downloads…</p></section>
<p class="hint">SELECT AN ICON TO OPEN ITS DOWNLOAD</p></main>
<script>
const root=document.getElementById("downloads");
fetch("downloads.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Download list unavailable");return r.json();}).then(data=>{
 root.replaceChildren();
 const items=Array.isArray(data.downloads)?data.downloads:[];
 if(!items.length){root.textContent="No downloads available yet.";return;}
 for(const item of items){
  const link=document.createElement("a");link.className="download";link.href=item.url||"#";link.target="_blank";link.rel="noopener noreferrer";
  if(item.accent)link.style.setProperty("--accent",item.accent);
  const icon=document.createElement("div");icon.className="icon-wrap";
  if(item.image){const img=document.createElement("img");img.src=item.image;img.alt="";img.loading="lazy";img.onerror=()=>{img.remove();const fallback=document.createElement("span");fallback.className="icon-fallback";fallback.textContent=item.icon||"↓";icon.append(fallback);};icon.append(img);}
  else{const fallback=document.createElement("span");fallback.className="icon-fallback";fallback.textContent=item.icon||"↓";icon.append(fallback);}
  const name=document.createElement("span");name.className="name";name.textContent=item.name||"Download";
  link.append(icon,name);
  if(item.description){const desc=document.createElement("span");desc.className="description";desc.textContent=item.description;link.append(desc);}
  if(!item.url){link.removeAttribute("target");link.setAttribute("aria-disabled","true");link.addEventListener("click",e=>e.preventDefault());}
  root.append(link);
 }
}).catch(error=>{console.error(error);root.textContent="Downloads could not be loaded. Please try again later.";});
</script>
<script>
(() => {
  const canvas = document.getElementById('liquid');
  const gl = canvas.getContext('webgl', {alpha:false, antialias:false, powerPreference:'high-performance'});
  if (!gl) { canvas.classList.add('shader-fallback'); return; }
  const vertex = `attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}`;
  const fragment = `precision highp float;
uniform vec2 u_res;
uniform vec2 u_mouse;
uniform float u_time;
uniform float u_active;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),
             mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.0+vec2(13.7,8.3);a*=0.5;}
  return v;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 p=(uv-0.5)*vec2(u_res.x/u_res.y,1.0);
  float t=u_time*0.105;
  vec2 m=(u_mouse-0.5)*vec2(u_res.x/u_res.y,1.0);
  float md=length(p-m);
  float pull=exp(-md*2.4)*u_active;

  // Slow, thick domain movement — broad shapes rather than watery ripples.
  vec2 warp=vec2(
    fbm(p*1.65+vec2(t,-t*0.7)),
    fbm(p*1.65+vec2(-t*0.55,t*0.8))
  );
  vec2 q=p+(warp-0.5)*0.56;
  q+=(p-m)*pull*0.20*sin(t*5.0+md*4.0);

  // Large smooth colour masses overlap like poured, viscous slime.
  float flowA=sin(q.x*2.25+q.y*1.55+t*1.15+warp.x*2.8);
  float flowB=cos(q.y*2.7-q.x*1.2-t*0.8+warp.y*2.6);
  float flowC=sin((q.x+q.y*0.65)*1.7-t*0.55+fbm(q*2.0)*2.4);
  float mass=flowA*0.42+flowB*0.34+flowC*0.24;
  float blobs=smoothstep(-0.42,0.40,mass);
  float inner=smoothstep(0.02,0.62,mass+fbm(q*2.25+t*0.15)*0.18);

  // The palette follows the logo: bright cyan, electric blue, violet and hot pink.
  vec3 cyan=vec3(0.015,0.91,0.98);
  vec3 aqua=vec3(0.16,1.0,0.88);
  vec3 blue=vec3(0.015,0.30,1.0);
  vec3 deepBlue=vec3(0.025,0.10,0.78);
  vec3 violet=vec3(0.34,0.055,0.98);
  vec3 pink=vec3(1.0,0.055,0.66);

  float vertical=uv.y;
  vec3 base=mix(pink,violet,smoothstep(0.02,0.46,vertical));
  base=mix(base,blue,smoothstep(0.36,0.70,vertical));
  base=mix(base,cyan,smoothstep(0.62,0.98,vertical));
  float colourNoise=fbm(q*1.25+vec2(t*0.22,-t*0.18));
  base=mix(base,aqua,smoothstep(0.52,0.92,colourNoise+vertical*0.18)*0.56);

  vec3 slime=mix(deepBlue,blue,smoothstep(-0.55,0.55,mass));
  slime=mix(slime,violet,smoothstep(0.12,0.76,flowC+colourNoise*0.28)*0.76);
  slime=mix(slime,pink,smoothstep(0.52,0.94,fbm(q*1.8+vec2(2.4,-t*0.3)))*0.82);
  slime=mix(slime,cyan,smoothstep(0.20,0.86,flowA-flowB*0.22)*0.72);

  // Broad, soft boundaries give the forms a thick gel / slime appearance.
  vec3 col=mix(base,slime,0.30+0.64*blobs);
  float ridge=1.0-smoothstep(0.015,0.105,abs(mass-0.03));
  col=mix(col,vec3(0.56,0.99,1.0),ridge*0.20);
  float softGlow=smoothstep(0.42,0.96,inner)*0.12;
  col+=vec3(0.10,0.30,0.34)*softGlow;
  col+=vec3(0.0,0.16,0.27)*pull*0.30;

  // Keep the whole canvas luminous; only a gentle edge falloff.
  float vignette=1.0-0.16*smoothstep(0.35,1.15,length((uv-0.5)*vec2(1.0,0.82)));
  col*=vignette;
  col=pow(max(col,vec3(0.0)),vec3(0.88));
  gl_FragColor=vec4(col,1.0);
}`;
  function shader(type, source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('VolirizeMP shader compile failed:',gl.getShaderInfoLog(s));return null;}return s;}
  const vs=shader(gl.VERTEX_SHADER,vertex), fs=shader(gl.FRAGMENT_SHADER,fragment);
  if(!vs||!fs){ canvas.classList.add('shader-fallback'); return; }
  const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){ console.error('VolirizeMP shader link failed:',gl.getProgramInfoLog(program)); canvas.classList.add('shader-fallback'); return; }
  gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const res=gl.getUniformLocation(program,'u_res'),mouse=gl.getUniformLocation(program,'u_mouse'),time=gl.getUniformLocation(program,'u_time'),active=gl.getUniformLocation(program,'u_active');
  let mx=.5,my=.5,target=0,energy=0,start=performance.now();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){const d=Math.min(window.devicePixelRatio||1,1.65);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(res,canvas.width,canvas.height);}
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight;target=1;},{passive:true});
  window.addEventListener('pointerleave',()=>target=0);
  resize();
  function frame(now){energy+=(target-energy)*.035;gl.uniform1f(time,reduced?0:(now-start)/1000);gl.uniform2f(mouse,mx,my);gl.uniform1f(active,energy);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
</body></html>
